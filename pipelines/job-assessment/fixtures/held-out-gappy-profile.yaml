# and no warnings, but has weak spots only a careful reader can find. It is the
# held-out test file for the "find gaps in my central file" prompt: the prompt
# was written and tuned against fixtures/gappy-profile.yaml, and nothing in the
# prompt describes the gaps in this one. The list of planted gaps is kept in
# tests/test_validate_profile.py, not here.
