# job-fit-screen — example criteria file
#
# This is a PLACEHOLDER with fake example values. Copy this file to
# criteria.yaml (or any private location outside this repo) and replace
# every value with your own real preferences before running the tool.
#
# Nothing in this file is read by the tool by default — you must point the
# tool at your own criteria file explicitly. Keep your real criteria file
# private; it's meant to hold personal details (salary numbers, employer
# history, hard-won lessons) that don't belong in a shared repo.

hard_blocks:
  # Any single true match here means the tool drops the posting entirely.
  # No scoring, no partial credit, no exceptions.
  - id: example_industry_block
    label: "Example: an industry you refuse to work in"
    match_hints: ["replace", "with", "keywords", "that", "indicate", "this", "industry"]

  - id: example_location_block
    label: "Example: not remote, if remote is a hard requirement for you"
    match_hints: ["hybrid", "onsite", "in-office", "relocation required"]
    exceptions: "Describe any exception here, e.g. occasional travel that's still fine"

requirements:
  # Must-haves. A miss here is a strong reject, but — unlike hard_blocks —
  # these are judgment calls a human might override for an exceptional
  # posting, so the tool should flag and score these, not silently drop them.
  - id: example_benefit_requirement
    label: "Example: a benefit you need at a minimum standard"
    why: "Explain why this matters to you — this is what makes the criteria file yours."
    check_via: ["Where you'd actually verify this — Glassdoor, the posting, a recruiter call"]

  - id: example_pay_range
    label: "Example: base salary target range"
    min: 0
    target: 0
    open_ask: 0
    stretch_ceiling: 0
    currency: USD
    note: "Explain any conditions on when the stretch ceiling applies."

autonomy_filter:
  # An example of a non-binary judgment call worth scoring rather than
  # reducing to a single yes/no field.
  label: "Example: describe the single biggest thing that predicts whether you'll be happy in a role"
  positive_signals:
    - "A phrase or pattern in a posting that's a good sign"
  negative_signals:
    - "A phrase or pattern in a posting that's a bad sign"

keyword_signals:
  # A different kind of criterion than everything above: literal LANGUAGE
  # PATTERNS worth scanning for directly in a posting's own text, rather
  # than facts you'd have to research (Glassdoor, a recruiter call, etc).
  # Weight each phrase by how strong a signal it is. This is a fast first
  # pass over posting text, not a substitute for the deeper criteria above —
  # a posting can score well on keywords and still fail a hard_block or the
  # autonomy_filter.
  #
  # Same caveat as hard_blocks' match_hints: these need context-aware
  # matching (an LLM, or careful negation-handling), not naive substring
  # search. "We don't micromanage" and "we require close daily oversight"
  # could both contain the word "oversight" — the sentence around a phrase
  # is what actually carries the meaning, not the phrase alone.
  strong_positive:
    - phrase: "example: a phrase that's a very strong good sign for you"
      why: "Explain why this phrase specifically, and what it maps to among your criteria above."

  positive:
    - phrase: "example: a phrase that's a mild good sign"
      why: "Explain why."

  negative:
    - phrase: "example: a phrase that's a mild bad sign"
      why: "Explain why."

  strong_negative:
    - phrase: "example: a phrase that's a very strong bad sign, maybe even a backstop for one of your hard_blocks"
      why: "Explain why."

  usage_note: >
    Seed list only — this grows as you actually screen real postings.
    When a posting's wording teaches you something new (a phrase that
    turned out to predict a good or bad fit), add it here with a `why`
    rather than only noting it once and losing the pattern.

qualifications_match:
  # A different question from everything above. Those sections check FIT —
  # would this company treat you the way you need to be treated. This
  # section checks ELIGIBILITY — are you actually qualified for what's
  # being asked. A posting can pass every fit check and still be a bad
  # target if the required experience doesn't line up with your real
  # skills. Keep this honest — the point is catching a real mismatch
  # early, not talking yourself into (or out of) a posting.
  core_skills_and_evidence:
    # What you'd check a posting's required/standout language against —
    # your actual documented strengths, not aspirational skills.
    - "Example: a real, evidenced skill you can point to concrete work for"
    - "Example: another one"

  known_gaps:
    # Real, specific gaps — not vague self-doubt, named domains you don't
    # have hands-on depth in. A posting leaning heavily on these in its
    # REQUIRED experience (not just a nice-to-have) is a real signal.
    - "Example: a specific technical domain or credential you genuinely lack"

  working_philosophy:
    # A different kind of signal than a skill gap: what KIND of role you're
    # good at and want, independent of any single posting's specific
    # domain. Useful when a posting's requirements reflect an underlying
    # role-design choice, not just an unfamiliar subject.
    stance: "Example: describe how you actually prefer to work — e.g. 'I'm a generalist who gathers information from experts rather than becoming the expert myself,' or the opposite, whatever's true for you."
    why: "Explain why this is a deliberate choice, not a confidence gap or something you're avoiding."
    what_to_check: "Describe what to look for in a posting's language that would signal it's asking for the OTHER working style than yours — not just an unfamiliar domain, but a fundamentally different way of approaching the role."

  how_to_apply: >
    For any real posting: pull its "required experience" and "what will
    make you stand out" (or equivalent) sections verbatim, then check each
    line against core_skills_and_evidence and known_gaps above. A
    required-experience list heavy with known_gaps items is a real fit
    problem worth flagging — distinct from and in addition to any
    autonomy/culture checks elsewhere in this file. A standout-
    qualifications list that closely matches core_skills_and_evidence is
    worth surfacing as a strong reason to apply even when other parts of
    the posting are imperfect.

soft_flags:
  # Worth surfacing next to a posting. None of these disqualify on their
  # own — they're context for the human making the final call.
  - id: example_soft_flag
    label: "Example: something worth noting but not disqualifying"
    why: "Explain why this is worth flagging, even though it's not a hard block."

availability:
  notice_period: "Example: how soon you could actually start if offered the job today"
  work_authorization:
    status: "Example: your citizenship/visa status"
    non_us_employer_handling: "Example: how to treat employers based outside your country"

format_note: >
  This file is deliberately flat and hand-editable. Extend it with your own
  ids and fields as your own criteria grow more specific — just keep ids
  stable once the tool starts referencing them.
