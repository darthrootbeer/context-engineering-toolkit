name: links

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '41 6 * * 1'   # weekly, Monday: catches links that rot after publishing
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    name: check links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check every link in the docs
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          # 429 means "slow down", not "broken". LinkedIn answers bots with 999, so it is skipped.
          # Saved model outputs under tests/ are excluded: they quote example links on purpose.
          args: >-
            --no-progress --max-retries 3 --timeout 20
            --accept 200,206,429
            --exclude 'linkedin\.com'
            --exclude-path patterns/tests
            --exclude-path pipelines/job-assessment/tests
            --exclude-path pipelines/docs-pipeline/tests
            README.md ROADMAP.md './patterns/*.md' './pipelines/**/*.md' './skills/**/*.md'
          fail: true
