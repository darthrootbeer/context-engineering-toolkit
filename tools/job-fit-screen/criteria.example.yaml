# job-fit-screen — example criteria file
#
# This is a PLACEHOLDER with fake example values. Copy this file to
# criteria.yaml (or any private location outside this repo) and replace
# every value with your own real preferences before running the tool.
#
# Nothing in this file is read by the tool by default — you must point the
# tool at your own criteria file explicitly. Keep your real criteria file
# private; it's meant to hold personal details (salary numbers, employer
# history, hard-won lessons) that don't belong in a shared repo.

hard_blocks:
  # Any single true match here means the tool drops the posting entirely.
  # No scoring, no partial credit, no exceptions.
  - id: example_industry_block
    label: "Example: an industry you refuse to work in"
    match_hints: ["replace", "with", "keywords", "that", "indicate", "this", "industry"]

  - id: example_location_block
    label: "Example: not remote, if remote is a hard requirement for you"
    match_hints: ["hybrid", "onsite", "in-office", "relocation required"]
    exceptions: "Describe any exception here, e.g. occasional travel that's still fine"

requirements:
  # Must-haves. A miss here is a strong reject, but — unlike hard_blocks —
  # these are judgment calls a human might override for an exceptional
  # posting, so the tool should flag and score these, not silently drop them.
  - id: example_benefit_requirement
    label: "Example: a benefit you need at a minimum standard"
    why: "Explain why this matters to you — this is what makes the criteria file yours."
    check_via: ["Where you'd actually verify this — Glassdoor, the posting, a recruiter call"]

  - id: example_pay_range
    label: "Example: base salary target range"
    min: 0
    target: 0
    open_ask: 0
    stretch_ceiling: 0
    currency: USD
    note: "Explain any conditions on when the stretch ceiling applies."

autonomy_filter:
  # An example of a non-binary judgment call worth scoring rather than
  # reducing to a single yes/no field.
  label: "Example: describe the single biggest thing that predicts whether you'll be happy in a role"
  positive_signals:
    - "A phrase or pattern in a posting that's a good sign"
  negative_signals:
    - "A phrase or pattern in a posting that's a bad sign"

soft_flags:
  # Worth surfacing next to a posting. None of these disqualify on their
  # own — they're context for the human making the final call.
  - id: example_soft_flag
    label: "Example: something worth noting but not disqualifying"
    why: "Explain why this is worth flagging, even though it's not a hard block."

availability:
  notice_period: "Example: how soon you could actually start if offered the job today"
  work_authorization:
    status: "Example: your citizenship/visa status"
    non_us_employer_handling: "Example: how to treat employers based outside your country"

format_note: >
  This file is deliberately flat and hand-editable. Extend it with your own
  ids and fields as your own criteria grow more specific — just keep ids
  stable once the tool starts referencing them.
