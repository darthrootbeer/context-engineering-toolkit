name: ci

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'   # weekly, Monday: full-history safety scan
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safety:
    name: safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - name: Scan the whole tree
        run: python3 .github/scripts/safety_scan.py --tree
      - name: Scan the lines this pull request adds
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          python3 .github/scripts/safety_scan.py --range "origin/${{ github.base_ref }}...HEAD"
      - name: Scan the full history
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python3 .github/scripts/safety_scan.py --history
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  tests:
    name: tests (${{ matrix.os }}, python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.10', '3.12']
    defaults:
      run:
        working-directory: pipelines/job-assessment
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements.txt
      - name: Run the tests
        # pytest exits 5 when it finds no tests. That is expected until the
        # first work package adds some, so only that exit code is tolerated.
        shell: bash
        run: python3 -m pytest -q || [ $? -eq 5 ]

  clean-clone:
    name: clean-clone
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Clone the repo fresh, at the commit under test
        shell: bash
        run: |
          git clone "https://github.com/${{ github.repository }}" fresh
          cd fresh
          git fetch --no-tags origin "${GITHUB_SHA}"
          git checkout --detach "${GITHUB_SHA}"
          git log -1 --format='testing commit %H'
      - name: Install into a new virtual environment
        working-directory: fresh/pipelines/job-assessment
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -r requirements.txt
      - name: The validator accepts the fictional person and rejects the broken file
        working-directory: fresh/pipelines/job-assessment
        shell: bash
        run: |
          "$RUNNER_TEMP/venv/bin/python" scripts/validate_profile.py --fixture fixtures/robin-sample/career-profile.yaml
          set +e
          "$RUNNER_TEMP/venv/bin/python" scripts/validate_profile.py --fixture fixtures/broken-profile.yaml
          [ $? -eq 1 ]
      - name: Run the whole chain offline on all three fictional postings
        working-directory: fresh/pipelines/job-assessment
        shell: bash
        run: |
          for id in 01-strong-fit 02-job-type-override 03-unlisted-pay-perks; do
            echo "=== $id"
            "$RUNNER_TEMP/venv/bin/python" scripts/assess_offline.py "fixtures/postings/$id.md" \
              --findings "fixtures/findings/$id.findings.json" \
              --profile fixtures/robin-sample/career-profile.yaml \
              --out "/tmp/ja-out/$id" --date 2026-10-01 2>/dev/null
          done
      - name: Run the full test suite, including the golden-file comparison
        working-directory: fresh/pipelines/job-assessment
        run: |
          "$RUNNER_TEMP/venv/bin/python" -m pytest -q -p no:cacheprovider
      - name: The run left the clone unchanged
        working-directory: fresh
        shell: bash
        run: test -z "$(git status --porcelain)"
